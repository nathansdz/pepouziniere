<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — La Pépouzinière</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="login-page">
    <div class="login-box">
      <div class="jul jul-small" aria-hidden="true">
        <svg viewBox="0 0 120 120" role="img" aria-label="Signe Jul">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
            <line x1="30" y1="25" x2="30" y2="95"/>
            <line x1="60" y1="25" x2="60" y2="95"/>
            <line x1="90" y1="25" x2="90" y2="95"/>
            <line x1="18" y1="45" x2="102" y2="45"/>
            <line x1="18" y1="75" x2="102" y2="75"/>
          </g>
        </svg>
      </div>
      <h1>La Pépouzinière</h1>
      <p class="login-intro">Bienvenue ! L'accès aux espaces partagés de l'internat nécessite un compte.</p>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab" id="tab-login" role="tab" aria-selected="true">Connexion</button>
        <button class="auth-tab" id="tab-signup" role="tab" aria-selected="false">Inscription</button>
      </div>

      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label for="login-pseudo">Pseudo</label>
          <input type="text" id="login-pseudo" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" autocomplete="current-password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>

      <form id="form-signup" class="auth-form" hidden>
        <div class="form-row">
          <div class="form-group">
            <label for="signup-prenom">Prénom</label>
            <input type="text" id="signup-prenom" autocomplete="given-name" required>
          </div>
          <div class="form-group">
            <label for="signup-nom">Nom</label>
            <input type="text" id="signup-nom" autocomplete="family-name" required>
          </div>
        </div>
        <div class="form-group">
          <label for="signup-pseudo">Pseudo</label>
          <input type="text" id="signup-pseudo" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Mot de passe</label>
          <input type="password" id="signup-password" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="signup-password2">Confirmer le mot de passe</label>
          <input type="password" id="signup-password2" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
      </form>

      <p id="auth-message" class="auth-message" hidden></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
